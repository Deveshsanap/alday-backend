# Server Configuration
server.port=8080

# This tells Spring Boot to look for cloud variables, but fall back to local if not found
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alday_healthcare}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:your_local_password}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Secret Configuration
jwt.secret=${JWT_SECRET:your_256_bit_or_larger_secret_key_for_signing_tokens_securely}
jwt.expirationMs=86400000